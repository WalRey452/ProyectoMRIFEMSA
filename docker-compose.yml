# ============================================================
# Docker Compose — Registro MRI v2.0
# FEMSA Salud CSIRT
# Uso: docker compose up -d
# ============================================================

name: registro-mri

networks:
  mri-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  uploads-data:
  pgadmin-data:
  backend-node-modules:
  frontend-node-modules:

services:

  # ─── PostgreSQL 16 ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: registro_mri
      POSTGRES_USER: mri_user
      POSTGRES_PASSWORD: MRI_SecurePass_2024!
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: America/Santiago
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./k8s/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - mri-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mri_user -d registro_mri"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis 7 ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mri-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - mri-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Backend NestJS (modo desarrollo con hot-reload) ────
  backend:
    image: node:20-alpine
    container_name: mri-backend
    restart: unless-stopped
    working_dir: /app
    # Instala dependencias y arranca en modo desarrollo
    command: sh -c "npm install && npm run start:dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: mri_user
      DB_PASSWORD: MRI_SecurePass_2024!
      DB_DATABASE: registro_mri
      DB_SSL: "false"
      DB_SYNCHRONIZE: "true"    # TypeORM crea tablas automáticamente
      DB_LOGGING: "false"
      JWT_SECRET: mri_jwt_secret_dev_2024_femsa_salud_csirt
      JWT_EXPIRATION: 8h
      JWT_REFRESH_SECRET: mri_refresh_secret_dev_2024_femsa_salud
      JWT_REFRESH_EXPIRATION: 7d
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: smtp.mailtrap.io
      SMTP_PORT: 2525
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "CSIRT FEMSA Salud <csirt@femsasalud.com>"
      FRONTEND_URL: http://localhost:4200
      CORS_ORIGINS: "http://localhost:4200,http://localhost"
      PASSWORD_EXPIRY_DAYS: 60
      PASSWORD_HISTORY_COUNT: 5
      MAX_LOGIN_ATTEMPTS: 5
      PUPPETEER_NO_SANDBOX: "true"
      TZ: America/Santiago
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - uploads-data:/app/uploads
    ports:
      - "3000:3000"   # API
      - "9229:9229"   # Debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mri-net

  # ─── Frontend Angular (modo desarrollo con hot-reload) ──
  frontend:
    image: node:20-alpine
    container_name: mri-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.json"
    environment:
      NODE_OPTIONS: "--max_old_space_size=4096"
      TZ: America/Santiago
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - mri-net

  # ─── pgAdmin (solo con: docker compose --profile tools up) ─
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mri-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@femsasalud.com
      PGADMIN_DEFAULT_PASSWORD: PgAdmin_MRI_2024!
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - mri-net
    profiles:
      - tools
