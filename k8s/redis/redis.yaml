# ============================================================
# Kubernetes Redis — Deployment + Service
# Registro MRI — FEMSA Salud CSIRT
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mri-redis
  namespace: registro-mri
  labels:
    app: mri-redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mri-redis
  template:
    metadata:
      labels:
        app: mri-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--save"
            - ""  # Deshabilitar persistencia en Redis (solo caché)
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: mri-redis-service
  namespace: registro-mri
  labels:
    app: mri-redis
spec:
  type: ClusterIP
  selector:
    app: mri-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
