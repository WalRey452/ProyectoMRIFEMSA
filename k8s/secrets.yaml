# ============================================================
# Kubernetes Secrets — Registro MRI
# ⚠️  IMPORTANTE: En producción, usar AWS Secrets Manager o
#     Vault. Estos valores están en base64 solo para referencia.
# ============================================================
# Para generar: echo -n "valor" | base64
#
# INSTRUCCIONES PARA AWS:
# 1. Crear secretos en AWS Secrets Manager
# 2. Instalar External Secrets Operator en el cluster
# 3. Reemplazar este archivo por ExternalSecret resources
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: mri-backend-secrets
  namespace: registro-mri
  labels:
    app: mri-backend
    app.kubernetes.io/name: registro-mri
  annotations:
    # En AWS, usar External Secrets Operator:
    # externalsecrets.k8s-external-secrets.io/backend: "aws-secrets-manager"
type: Opaque
stringData:
  # ─── Base de datos ─────────────────────────────────────
  # En AWS: usar usuario de AWS RDS y contraseña de Secrets Manager
  DB_USERNAME: "mri_user"
  DB_PASSWORD: "MRI_SecurePass_CHANGE_IN_PROD_2024!"

  # ─── JWT Tokens ────────────────────────────────────────
  # Generar con: openssl rand -base64 64
  JWT_SECRET: "CHANGE_THIS_JWT_SECRET_IN_PRODUCTION_USE_OPENSSL_RAND_BASE64_64"
  JWT_REFRESH_SECRET: "CHANGE_THIS_REFRESH_SECRET_IN_PRODUCTION_USE_OPENSSL_RAND_BASE64_64"

  # ─── Redis ─────────────────────────────────────────────
  REDIS_PASSWORD: ""

  # ─── SMTP ──────────────────────────────────────────────
  SMTP_HOST: "smtp.femsasalud.com"
  SMTP_USER: "csirt@femsasalud.com"
  SMTP_PASS: "CHANGE_SMTP_PASSWORD"

  # ─── AWS (para S3 en producción) ────────────────────────
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""
  # AWS_S3_BUCKET: "registro-mri-files-prod"

---
# Secret para PostgreSQL (usado por el StatefulSet)
apiVersion: v1
kind: Secret
metadata:
  name: mri-postgres-secrets
  namespace: registro-mri
type: Opaque
stringData:
  POSTGRES_USER: "mri_user"
  POSTGRES_PASSWORD: "MRI_SecurePass_CHANGE_IN_PROD_2024!"
  POSTGRES_DB: "registro_mri"
